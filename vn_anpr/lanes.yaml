# Cấu hình luồng camera theo làn (chế độ worker RTSP)
work_dir: runtime                 # chứa outbox.jsonl (sự kiện chờ gửi lại)
evidence_dir: runtime/evidence    # ảnh bằng chứng biển số, phục vụ tra soát
webhook:
  url: "${PARKING_WEBHOOK_URL}"   # API của phần mềm bãi đỗ nhận sự kiện
  api_key_header: X-API-Key
  api_key_env: PARKING_API_KEY    # khóa đọc từ biến môi trường, không ghi vào file
  timeout_s: 3
  retries: 3
lanes:
  - lane_id: CONG_A_VAO
    direction: in
    source: "rtsp://${CAM_USER}:${CAM_PASS}@10.0.0.11:554/stream1"   # [ĐIỀN THEO THỰC TẾ]
  - lane_id: CONG_A_RA
    direction: out
    source: "rtsp://${CAM_USER}:${CAM_PASS}@10.0.0.12:554/stream1"   # [ĐIỀN THEO THỰC TẾ]
